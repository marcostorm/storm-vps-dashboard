name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install storm-mcp-common (pinned tag)
        run: pip install git+https://github.com/marcostorm/storm-mcp-common.git@v0.1.0
      - run: pip install -e '.[dev]' ruff
      - run: ruff check src tests
      - run: pytest -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning scripts/vps/*.sh scripts/local/*.sh
