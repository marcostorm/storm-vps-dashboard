services:
  dashboard:
    build:
      context: /opt/stormlab/storm-vps-dashboard
    container_name: storm-vps-dashboard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /root/.ssh:/root/.ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stormvps-dashboard.rule=Host(`${DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.stormvps-dashboard.entrypoints=websecure"
      - "traefik.http.routers.stormvps-dashboard.tls=true"
      - "traefik.http.routers.stormvps-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stormvps-dashboard.middlewares=stormvps-dashboard-auth"
      - "traefik.http.middlewares.stormvps-dashboard-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS}"
      - "traefik.http.services.stormvps-dashboard.loadbalancer.server.port=8501"

networks:
  traefik_proxy:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-stormlab}
