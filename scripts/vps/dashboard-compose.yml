services:
  dashboard:
    build:
      context: /opt/stormlab/storm-vps-dashboard
    container_name: storm-vps-dashboard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /root/.ssh:/root/.ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS}"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8501"

networks:
  traefik_proxy:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-stormlab}
