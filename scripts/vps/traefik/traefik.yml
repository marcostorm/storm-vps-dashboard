api:
  dashboard: true

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'

providers:
  docker:
    endpoint: tcp://docker-socket-proxy:2375
    exposedByDefault: false
    network: stormlab

certificatesResolvers:
  letsencrypt:
    acme:
      email: mhstorms@gmail.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web
